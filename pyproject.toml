[project]
name = "heatWave"
version = "1.3.2"
description = "Automated heat sheet generator for USA Swimming meets — transforms psych sheets into professional PDFs"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "EcstaticTech641"}]
requires-python = ">=3.11"
dependencies = [
    "PyMuPDF",
    "pdfplumber",
    "pydantic",
    "reportlab",
    "streamlit",
    "pywebview",
    "pywin32>=306",
    "pytest",
    "python-dotenv",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"